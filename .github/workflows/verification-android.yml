name: Shared Android verification
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      level:
        type: string
        default: source
permissions:
  contents: read
# Only a caller changing native/packaging inputs should invoke source checks.
# Release callers must request integration, never substitute source checks.
jobs:
  build:
    name: Android source and JVM
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require exact source and existing native acceptance infrastructure
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          LEVEL: ${{ inputs.level }}
        shell: python
        run: |
          import os, pathlib, re, subprocess
          assert re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE_SHA'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_SHA']
          assert os.environ['LEVEL'] in ('source','integration','release')
          assert pathlib.Path('android/app/build.gradle').is_file(), 'NOT VERIFIED: Android source unavailable'
          if os.environ['LEVEL'] != 'source':
              assert pathlib.Path('scripts/android_emulator_acceptance.sh').is_file(), 'NOT VERIFIED: installed acceptance unavailable'
              assert pathlib.Path('scripts/android_acceptance_fixture.py').is_file(), 'NOT VERIFIED: synthetic fixture builder unavailable'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Native source compilation and JVM contracts (no complete APK)
        if: inputs.level == 'source'
        run: gradle -p android compileDebugJavaWithJavac testDebugUnitTest --stacktrace
      - name: Prepare synthetic fixture and build app/test APKs once
        if: inputs.level != 'source'
        run: |
          python -m pip install -r requirements-mobile.txt
          python scripts/android_acceptance_fixture.py android/app/src/androidTest/assets/acceptance
          gradle -p android assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace
          mkdir -p android-evidence
          git rev-parse HEAD 'HEAD^{tree}' > android-evidence/source.txt
          sha256sum android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/androidTest/debug/*.apk > android-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.level != 'source' }}
        with:
          name: shared-android-build-${{ inputs.source_sha }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android-evidence/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-android-jvm-${{ inputs.source_sha }}-${{ github.run_id }}
          path: android/app/build/test-results/**
          if-no-files-found: error
  installed:
    name: Installed Android (${{ matrix.api }})
    needs: build
    if: inputs.level != 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: shared-android-build-${{ inputs.source_sha }}-${{ github.run_id }}
      - name: Verify exact build identity and APK bytes before installation
        env:
          EXPECTED: ${{ inputs.source_sha }}
        run: |
          test "$(head -1 android-evidence/source.txt)" = "$EXPECTED"
          sha256sum -c android-evidence/SHA256SUMS.txt
      - name: Enable KVM on disposable synthetic runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android_emulator_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-android-installed-${{ matrix.api }}-${{ inputs.source_sha }}-${{ github.run_id }}
          path: android-evidence/**
          if-no-files-found: error
