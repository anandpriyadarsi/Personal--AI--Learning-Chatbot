name: ANVAYA Smart Verification V2 shared coordinator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'feature/smart-verification-v2-shared-coordinator-2026-10-25'
      - 'integration/**'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Fast feedback, or authoritative synthetic integration tests'
        type: choice
        required: true
        default: fast
        options: [fast, integration]
      expected_sha:
        description: 'Required exact commit SHA for manual integration verification'
        required: false
        type: string

permissions:
  contents: read

# A newer commit supersedes stale feedback for the same branch or PR.
concurrency:
  group: shared-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-feedback:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/integration/')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'fast') }}
    name: Four-stream fast feedback (not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-learning-studio.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tracked Python dependencies
        run: python -m pip install -r requirements-learning-studio.txt
      - name: Prove old and new selector safety
        run: python -m pytest -q tests/test_smart_verify.py tests/test_verification_coordinator.py --junitxml=shared-selector.xml
      - name: Run change-aware Python and targeted JS contracts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          test -n "$BASE_SHA"
          python scripts/verification_coordinator.py --base "$BASE_SHA" --head HEAD \
            --execute --json shared-verification.json
      - name: Explain exact-head evidence and remaining gates
        if: always()
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          p = Path('shared-verification.json')
          data = json.loads(p.read_text()) if p.is_file() else {'outcome': 'NO_REPORT'}
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert data.get('source_sha', sha) == sha
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
            f.write('## Four-stream fast feedback (NOT merge acceptance)\n')
            f.write('Exact SHA: `' + sha + '`\n\n')
            f.write('Outcome: ' + data['outcome'] + '\n\n')
            f.write('Streams: ' + ', '.join(data.get('streams', [])) + '\n\n')
            f.write('Python files: ' + str(len(data.get('python_tests', []))) + '; JS contracts: ' + str(len(data.get('javascript_tests', []))) + '\n\n')
            f.write('Cross-platform architecture, Android installed lifecycle, private fixtures, production data integrity and physical phone tests are NOT certified here.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-fast-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            shared-verification.json
            shared-fast.xml
            shared-selector.xml

  integrated-synthetic:
    # This stage runs only for a deliberate integration candidate, not every
    # development commit. Android and private-fixture gates remain separate.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'integration') }}
    name: Integration architecture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ANVAYA_BROWSER_TESTS: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fail closed on unexpected manual integration SHA
        shell: python
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ.get('EXPECTED_SHA', '')
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
            assert re.fullmatch(r'[0-9a-f]{40}', expected) and actual == expected, 'Manual integration must pin the reviewed exact SHA'
          print('Integration source SHA:', actual)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-assessment-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve historical source line endings
        run: python scripts/architecture_checkout_eol.py --repo .
      - name: Install complete tracked acceptance dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-assessment-browser.txt
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Canonical complete synthetic architecture validation
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'shared-architecture'
          sys.exit(subprocess.call([sys.executable, 'scripts/architecture_validation.py',
                                    '--require-clean', '--output', str(output)]))
      - name: Retain canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-integration-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/shared-architecture/**

  integrated-result:
    if: ${{ always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'integration')) }}
    needs: integrated-synthetic
    name: Integration synthetic gate (Android pending)
    runs-on: ubuntu-latest
    steps:
      - name: Preserve exact SHA and fail on missing platform
        shell: python
        env:
          RESULT: ${{ needs.integrated-synthetic.result }}
          SHA: ${{ github.sha }}
        run: |
          import json, os
          from pathlib import Path
          ok = os.environ['RESULT'] == 'success'
          report = {
            'source_sha': os.environ['SHA'],
            'stage': 'integration',
            'linux_windows_synthetic': 'PASS' if ok else 'FAIL',
            'android_build_emulator_and_device': 'PENDING: independent installed checks required',
            'private_fixture_authority': 'PENDING: owner-approved protected run required',
            'release_approved': False,
          }
          Path('shared-integration-gate.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if not ok:
            raise SystemExit(1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-integration-gate-${{ github.sha }}
          path: shared-integration-gate.json
