name: Tutor V2.0–2.3 integration acceptance

on:
  pull_request:
    paths:
      - 'personal_learning_assistant/tutor/**'
      - 'personal_learning_assistant/services/grounded_tutor_service.py'
      - 'personal_learning_assistant/services/tutor_session_service.py'
      - 'personal_learning_assistant/services/academic_agent_web_service.py'
      - 'personal_learning_assistant/repositories/sqlite/tutor_repository.py'
      - 'personal_learning_assistant/repositories/sqlite/migration_runner.py'
      - 'personal_learning_assistant/repositories/sqlite/optional_migrations/**'
      - 'personal_learning_assistant/domain/grounded_tutor_models.py'
      - 'personal_learning_assistant/ui/web/**'
      - 'tests/test_tutor*.py'
      - 'tests/test_phase7_5_academic_agent_web.py'
      - '.github/workflows/tutor-v2-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Tutor reconciliation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ANVAYA_BROWSER_TESTS: '1'
      ANVAYA_VALIDATION_ARTIFACTS: ${{ runner.temp }}/tutor-screenshots
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-assessment-browser.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-assessment-browser.txt
      - name: Install Chromium Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Compile integrated Tutor without executing provider
        run: python -m compileall -q personal_learning_assistant/tutor personal_learning_assistant/services/grounded_tutor_service.py personal_learning_assistant/services/tutor_session_service.py personal_learning_assistant/ui/web/tutor_rendering.py
      - name: Validate original Tutor teaching contracts and current web safety
        run: >
          python -m pytest -q
          tests/test_tutor_v2_safe_readability_reconciliation.py
          tests/test_tutor21_adaptive_intelligence.py
          tests/test_tutor21_correctness.py
          tests/test_tutor21_retrieval_planner.py
          tests/test_tutor21_live_validation_fixes.py
          tests/test_tutor22_student_model.py
          tests/test_tutor22_memory_candidates.py
          tests/test_tutor22_signal_aggregation.py
          tests/test_tutor22_personalized_policy.py
          tests/test_tutor23_diagnostic_questioning.py
          tests/test_tutor23_prerequisite_reasoning.py
          tests/test_tutor23_adaptive_practice.py
          tests/test_tutor23_goal_exit_check.py
          tests/test_tutor23_live_validation.py
          tests/test_tutor23_live_browser_integration.py
          tests/test_phase7_5_academic_agent_web.py
          --junitxml=tutor-reconciliation.xml
      - name: Preserve acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-v2-reconciliation-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            tutor-reconciliation.xml
            ${{ env.ANVAYA_VALIDATION_ARTIFACTS }}/*.png
