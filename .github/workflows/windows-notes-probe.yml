name: Windows notes concurrency diagnostic
on:
  push:
    branches: [ci/windows-notes-lock-probe-2026-10-26]
permissions:
  contents: read
jobs:
  notes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mobile.txt
      - name: Notes and backup contracts including persistent-lock failure safety
        run: python -m pytest -q tests/test_notes_media.py tests/test_android_backup.py tests/test_nested_notes.py tests/test_nested_notes_routes.py
      - name: Repeat the original concurrent-tap regression without accepting a failed attempt
        shell: python
        run: |
          import subprocess,sys
          for attempt in range(20):
              print('Independent Windows concurrency trial',attempt+1,flush=True)
              subprocess.run([sys.executable,'-m','pytest','-q','tests/test_notes_media.py::test_repeat_parallel_taps_deduplicate'],check=True)
