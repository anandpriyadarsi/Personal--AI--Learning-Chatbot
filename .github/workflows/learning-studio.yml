name: Learning Studio isolated validation
on:
  push:
    branches: ['feature/learning-studio-v1', 'feature/learning-studio-v1-1', 'feature/learning-studio-v1-2', 'feature/learning-studio-v1-3', 'feature/learning-studio-v1-4-integration-2026-10-15', 'feature/learning-studio-v1-5-source-quality-rechecks', 'feature/learning-studio-v1-6-complete-revision-queue', 'feature/learning-studio-subject-workspaces-chemistry', 'feature/learning-studio-reader-visual-refresh']
  workflow_dispatch:
concurrency:
  group: learning-studio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolated-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ANVAYA_BROWSER_TESTS: '1'
      ANVAYA_STUDIO_BASE_SHA: ${{ github.ref_name == 'feature/learning-studio-reader-visual-refresh' && '1ead8fd3bce6b6b564c23f0e2798b07145cb8826' || github.ref_name == 'feature/learning-studio-subject-workspaces-chemistry' && '723b2c27525f8fd807ea6d45ca935fb22e252b45' || github.ref_name == 'feature/learning-studio-v1-6-complete-revision-queue' && 'aebd8a8828cd4fa452128343882a44b9025aea0d' || github.ref_name == 'feature/learning-studio-v1-5-source-quality-rechecks' && 'aebd8a8828cd4fa452128343882a44b9025aea0d' || github.ref_name == 'feature/learning-studio-v1-4-integration-2026-10-15' && '6e520035b6b9ccf8e14c176b35b43e384c95d103' || github.ref_name == 'feature/learning-studio-v1-3' && '60875195f9b6c3145937c625f107244872d8891a' || github.ref_name == 'feature/learning-studio-v1-2' && '775941c730e8160501c849bc4971e8eb178331d1' || github.ref_name == 'feature/learning-studio-v1-1' && '9ed585ca8e1fbcfb6f5a7e0426d030560109115e' || 'f859a3c7cdf44baadc17d9bd1a6c656530c1b5bf' }}
      ANVAYA_BROWSER_ARTIFACTS: learning-studio-evidence/browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-learning-studio.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-learning-studio.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Health, feature/browser, focused and sequential full-suite gates
        run: python scripts/learning_studio_validate.py --scope all --base ${{ env.ANVAYA_STUDIO_BASE_SHA }} --output learning-studio-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-studio-${{ matrix.os }}
          path: learning-studio-evidence/
