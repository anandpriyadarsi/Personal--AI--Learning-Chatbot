name: Unified installed-runtime diagnostic probe
on:
  push:
    branches: [ci/unified-installed-runtime-probe-2026-10-26]
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-installed-runtime
  cancel-in-progress: true
jobs:
  diagnostic:
    uses: ./.github/workflows/verification-android.yml
    with:
      source_sha: ${{ github.sha }}
      level: integration
