name: Unified installed-runtime diagnostic probe
on:
  push:
    branches: [ci/unified-installed-runtime-probe-2026-10-26]
permissions:
  contents: read
  actions: read
jobs:
  native-pdf:
    name: Diagnostic native PDF page (${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be917bb07117ca7e2a6f193520a29461b45b8ffe
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: shared-android-build-be917bb07117ca7e2a6f193520a29461b45b8ffe-40263583128
          run-id: 40263583128
          github-token: ${{ github.token }}
      - name: Verify immutable diagnostic APK bytes
        run: |
          test "$(head -1 android-evidence/source.txt)" = be917bb07117ca7e2a6f193520a29461b45b8ffe
          sha256sum -c android-evidence/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class in.anvaya.privateapp.NativePdfPageTest in.anvaya.privateapp.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/native-pdf-page.log
            python -c "from pathlib import Path;s=Path('android-evidence/native-pdf-page.log').read_text();assert 'OK (1 test)' in s and not any(v in s for v in ('FAILURES','INSTRUMENTATION_FAILED','shortMsg='))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-native-pdf-${{ matrix.api }}-${{ github.run_id }}
          path: android-evidence/**
          if-no-files-found: error
