name: Planning Analysis V2.1 reliability (synthetic)
on:
  push:
    branches: ['feature/planning-analysis-v2-1-reliability-2026-10-18', 'feature/planning-v21-authorized-wal-snapshot-2026-10-18']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-analysis-v21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reliability:
    name: V2.1 regression & browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ANVAYA_BROWSER_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-learning-studio.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-learning-studio.txt
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate syntax and source
        run: |
          python -m compileall -q personal_learning_assistant scripts tests
          git diff --check
      - name: V2.1 canonical planner and characterization
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'anvaya-v21'
          root.mkdir(exist_ok=True,parents=True)
          tests=[
            'tests/test_phase7_5_daily_agenda.py',
            'tests/test_phase7_5_month_plan_import.py',
            'tests/test_architecture_characterization.py',
            'tests/test_planning_analysis_v2.py',
            'tests/test_planning_v21_wal_snapshot.py',
            'tests/test_planning_v2_scheduler.py',
            'tests/test_planning_v2_proposals.py',
            'tests/test_planning_v2_review_regressions.py',
            'tests/test_planning_analysis_v2_browser.py',
            'tests/test_phase7_5_operational_planner_routes.py',
            'tests/test_phase7_5_progress_planning.py',
          ]
          cmd=[sys.executable,'-m','pytest','-q',*tests,'--junitxml='+str(root/'results.xml')]
          with (root/'tests.log').open('w',encoding='utf-8') as stream:
              code=subprocess.call(cmd,stdout=stream,stderr=subprocess.STDOUT)
          print((root/'tests.log').read_text(encoding='utf-8')[-24000:])
          sys.exit(code)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-v21-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/anvaya-v21/
