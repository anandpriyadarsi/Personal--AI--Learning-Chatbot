name: Phase 3.2 validation

on:
  push:
    branches:
      - phase3/phase3-2-ci-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-2-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Phase 3.2 complete validation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out validated implementation commit
        uses: actions/checkout@v4
        with:
          ref: 5068e88f76f2792ae0f7f9244590dd4ff9018a3e
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Run Phase 3.2 focused tests
        run: python -m pytest tests/test_phase3_reverse_export_restore.py -q

      - name: Run all Phase 3 tests
        run: python -m pytest tests/test_phase3_*.py -q

      - name: Run full pytest regression suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check implementation diff
        run: git diff --check 0bc74663678863c8e31b4e55c3a522a12bf5ea19..HEAD

      - name: Run final Phase 3 gate
        shell: pwsh
        run: ./phase3_final_gate.ps1 -Python python
