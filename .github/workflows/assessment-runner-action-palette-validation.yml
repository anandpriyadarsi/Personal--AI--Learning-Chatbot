name: Assessment Runner action and palette validation

on:
  push:
    branches:
      - "phase7.5.assessment-runner-ux/action-palette"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Runner JavaScript tests
        run: node --test tests/js/assessment_runner.test.cjs
      - name: Focused Assessment Runner tests
        run: |
          python -m pytest -q \
            tests/test_assessment_studio_phase_c.py \
            tests/test_assessment_studio_next_level_runner.py \
            tests/test_assessment_runner_math_fill_ux.py
      - name: Assessment Studio regression suite
        run: |
          python -m pytest -q \
            tests/test_assessment_studio_phase_a.py \
            tests/test_assessment_studio_phase_b.py \
            tests/test_assessment_studio_phase_c.py \
            tests/test_assessment_studio_phase_d.py \
            tests/test_assessment_studio_phase_e.py \
            tests/test_assessment_studio_phase_f.py \
            tests/test_assessment_studio_authoring_ux.py \
            tests/test_assessment_studio_blind_review.py \
            tests/test_assessment_studio_simplified_authoring.py \
            tests/test_assessment_studio_next_level.py \
            tests/test_assessment_studio_next_level_runner.py \
            tests/test_assessment_studio_next_level_results.py \
            tests/test_phase7_5_assessments.py
      - name: Compile and dependency check
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check
      - name: Diff hygiene
        run: git diff --check 2d05bd06b1f176d06b617ebb626c91eaee10d03b..HEAD
