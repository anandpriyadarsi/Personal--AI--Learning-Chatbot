name: Assessment Studio Phase F validation

on:
  push:
    branches:
      - "phase7.5.assessment-studio-f/validation"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Focused Phase F tests
        run: python -m pytest -q tests/test_assessment_studio_phase_f.py
      - name: Assessment Studio Phase A-E regressions
        run: python -m pytest -q tests/test_assessment_studio_phase_a.py tests/test_assessment_studio_phase_b.py tests/test_assessment_studio_phase_c.py tests/test_assessment_studio_phase_d.py tests/test_assessment_studio_phase_e.py tests/test_phase7_5_assessments.py
      - name: Operational planner regressions
        run: python -m pytest -q tests/test_phase7_5_operational_tasks.py tests/test_phase7_5_operational_planner_routes.py tests/test_phase7_5_operational_calendar.py
      - name: Schema and recovery regressions
        run: python -m pytest -q tests/test_phase3_sqlite_foundation.py tests/test_phase3_academic_schema.py tests/test_phase7_5_12_2_recovery.py
      - name: Compile and dependency check
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check
      - name: Clone-safe project regression suite
        run: |
          python -m pytest -q             --ignore=tests/test_phase7_5_academic_agent_web.py             --deselect "tests/test_phase2_closure_architecture.py::test_phase2_root_has_no_production_learning_assistant_database"             --deselect "tests/test_phase7_5_anvaya_shell.py::test_existing_phase75_get_routes_keep_working"
      - name: Migration integrity smoke test
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from personal_learning_assistant.repositories.sqlite.migration_runner import apply_migrations
          root = Path(tempfile.mkdtemp())
          path = root / "learning_assistant.db"
          assert apply_migrations(path) == tuple(range(1, 14))
          connection = sqlite3.connect(path)
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("PRAGMA foreign_key_check").fetchall() == []
          finally:
              connection.close()
          PY
      - name: Adaptive-loop boundary source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("personal_learning_assistant/services/adaptive_academic_loop_service.py").read_text(encoding="utf-8")
          assert "topic_progress_events" not in source
          assert "study_plan_items" not in source
          assert "daily_agenda_items" not in source
          assert "UPDATE topics" not in source
          assert "mark_mastered" not in source
          PY
      - name: Diff hygiene
        run: git diff --check 3039976fff8d221f6ad35119e9bfbeaa4af833db..HEAD
