name: Planning Analysis V2 cross-platform acceptance
on:
  push:
    branches: ['feature/planning-analysis-v2-2026-10-16']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-analysis-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Planning Analysis V2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-learning-studio.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tracked test dependencies
        run: python -m pip install -r requirements-learning-studio.txt
      - name: Restore historical EOL bytes without source changes
        run: python scripts/architecture_checkout_eol.py --repo .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Define external disposable output
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('ANVAYA_VALIDATION_OUTPUT='+os.path.join(os.environ['RUNNER_TEMP'],'planning-analysis-v2')+'\n')
      - name: Full tests, browser suites, architecture, Node and migration integrity
        shell: python
        run: |
          import os, subprocess, sys
          sys.exit(subprocess.call([sys.executable,'scripts/architecture_validation.py','--require-clean','--output',os.environ['ANVAYA_VALIDATION_OUTPUT']]))
      - name: Native Learning Studio feature and browser matrix
        if: always()
        shell: python
        run: |
          import os, subprocess, sys
          sys.exit(subprocess.call([sys.executable,'scripts/learning_studio_validate.py','--scope','feature','--base','d3fc9b583be1b5e98cf00960f4b7ad7217526b43','--output',os.path.join(os.environ['ANVAYA_VALIDATION_OUTPUT'],'learning')]))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-analysis-v2-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/run-*/*.json
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/run-*/*.md
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/run-*/*.log
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/run-*/*.xml
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/run-*/screenshots/*
            ${{ env.ANVAYA_VALIDATION_OUTPUT }}/learning/**
