name: Assessment Runner math fill-up validation

on:
  push:
    branches:
      - "phase7.5.assessment-runner-ux/math-fillup-validation-v2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Runner math and fill-up focused tests
        run: python -m pytest -q tests/test_assessment_runner_math_fill_ux.py

      - name: Runner JavaScript tests
        run: node --test tests/js/assessment_runner.test.cjs tests/js/assessment_math.test.cjs

      - name: Assessment Studio regression suite
        run: python -m pytest -q tests -k "assessment_studio or assessment_runner"

      - name: Compile and dependency check
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check

      - name: Portable broader project suite
        run: |
          python -m pytest -q tests             --ignore=tests/test_phase7_5_academic_agent_web.py             --deselect "tests/test_phase7_5_anvaya_shell.py::test_existing_phase75_get_routes_keep_working"

      - name: Migration integrity smoke test
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from personal_learning_assistant.repositories.sqlite.migration_runner import apply_migrations
          root = Path(tempfile.mkdtemp())
          path = root / "learning_assistant.db"
          assert apply_migrations(path) == tuple(range(1, 15))
          connection = sqlite3.connect(path)
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("PRAGMA foreign_key_check").fetchall() == []
          finally:
              connection.close()
          PY

      - name: Diff hygiene
        run: git diff --check ae1fab749f6db2ee4a013a003ecfadd38b1eaea1..HEAD
