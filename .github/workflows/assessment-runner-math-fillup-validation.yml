name: Assessment Runner math fill-up validation

on:
  push:
    branches:
      - "phase7.5.assessment-runner-ux/math-fillup-validation"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Focused math and fill-up tests
        run: python -m pytest -q tests/test_assessment_runner_math_fillup.py
      - name: Runner JavaScript tests
        run: |
          node --test tests/js/assessment_math.test.cjs
          node --test tests/js/assessment_runner.test.cjs
      - name: Runner and evaluation regressions
        run: |
          python -m pytest -q             tests/test_assessment_studio_phase_c.py             tests/test_assessment_studio_phase_d.py             tests/test_assessment_studio_next_level_runner.py             tests/test_assessment_studio_next_level_results.py
      - name: Assessment Studio regression suite
        run: |
          python -m pytest -q             tests/test_assessment_studio_phase_a.py             tests/test_assessment_studio_phase_b.py             tests/test_assessment_studio_phase_c.py             tests/test_assessment_studio_phase_d.py             tests/test_assessment_studio_phase_e.py             tests/test_assessment_studio_phase_f.py             tests/test_assessment_studio_authoring_ux.py             tests/test_assessment_studio_blind_review.py             tests/test_assessment_studio_simplified_authoring.py             tests/test_assessment_studio_next_level.py             tests/test_assessment_studio_next_level_runner.py             tests/test_assessment_studio_next_level_results.py             tests/test_phase7_5_assessments.py
      - name: Compile and dependency check
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check
      - name: Clone-safe broader project suite
        run: |
          python -m pytest -q             --ignore=tests/test_phase7_5_academic_agent_web.py             --deselect "tests/test_phase2_closure_architecture.py::test_phase2_root_has_no_production_learning_assistant_database"             --deselect "tests/test_phase7_5_anvaya_shell.py::test_existing_phase75_get_routes_keep_working"
      - name: Migration integrity smoke test
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from personal_learning_assistant.repositories.sqlite.migration_runner import apply_migrations
          root = Path(tempfile.mkdtemp())
          path = root / "learning_assistant.db"
          assert apply_migrations(path) == tuple(range(1, 15))
          connection = sqlite3.connect(path)
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("PRAGMA foreign_key_check").fetchall() == []
          finally:
              connection.close()
          PY
      - name: Diff hygiene
        run: git diff --check ae1fab749f6db2ee4a013a003ecfadd38b1eaea1..HEAD
