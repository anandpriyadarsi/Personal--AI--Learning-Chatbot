name: Publish verified unified Android debug release
on:
  workflow_run:
    workflows: [ANVAYA synthetic architecture validation]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
concurrency:
  group: unified-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_commit.message, 'Release ANVAYA unified Android') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require current main and the canonical successful architecture run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: python
        run: |
          import json, os, re, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True))
          sha=os.environ['SOURCE']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          assert api('git/ref/heads/main')['object']['sha']==sha, 'Main moved; do not release stale source'
          run=api('actions/runs/'+os.environ['RUN_ID'])
          assert run['head_sha']==sha and run['conclusion']=='success'
          assert run['path']=='.github/workflows/architecture-validation.yml'
          assert run['event']=='push' and run['head_branch']=='main'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
  android:
    needs: source
    uses: ./.github/workflows/verification-android.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      level: release
  publish:
    needs: [source, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.source.outputs.sha }}
      CANONICAL_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: shared-android-build-${{ needs.source.outputs.sha }}-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-android-installed-*-${{ needs.source.outputs.sha }}-${{ github.run_id }}
          path: opening-evidence
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
      - name: Verify tested APK identity and prepare transparent debug release
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(head -1 android-evidence/source.txt)" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE"
          sha256sum -c android-evidence/SHA256SUMS.txt
          mkdir release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/ANVAYA-Unified-Latest.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$build_tools" dump badging release-assets/ANVAYA-Unified-Latest.apk > release-assets/APK-METADATA.txt
          "$(dirname "$build_tools")/apksigner" verify --print-certs release-assets/ANVAYA-Unified-Latest.apk > release-assets/SIGNATURE.txt
          (cd release-assets && sha256sum ANVAYA-Unified-Latest.apk > SHA256SUMS.txt)
          python - <<'PY'
          import hashlib,json,os,re,subprocess,shutil,zipfile
          from pathlib import Path
          root=Path('release-assets');apk=root/'ANVAYA-Unified-Latest.apk'
          metadata=(root/'APK-METADATA.txt').read_text()
          assert "name='in.anvaya.privateapp'" in metadata
          assert "versionCode='19'" in metadata and "versionName='1.4.0-unified-debug'" in metadata
          assert "sdkVersion:'24'" in metadata
          opening=Path('android/app/src/main/res/drawable-nodpi/anvaya_opening.jpg')
          opening_sha='319e31420b50e2e420de571d0906835ee4f9894dedbd26b88435d0ca57415fb6'
          assert hashlib.sha256(opening.read_bytes()).hexdigest()==opening_sha
          with zipfile.ZipFile(apk) as archive:
              resources=[name for name in archive.namelist() if name.endswith('/anvaya_opening.jpg')]
              assert len(resources)==1
              assert hashlib.sha256(archive.read(resources[0])).hexdigest()==opening_sha
          for api in (31,35):
              folder=Path('opening-evidence')/('shared-android-installed-'+str(api)+'-'+os.environ['SOURCE']+'-'+os.environ['GITHUB_RUN_ID'])
              controls=list(folder.rglob('emulator-hardware-mainkeys.txt'))
              assert len(controls)==1 and controls[0].read_text().strip() in ('','0')
              for view in ('portrait','landscape','launch'):
                  frames=list(folder.rglob('android-opening-'+view+'.png'))
                  assert len(frames)==1 and frames[0].stat().st_size>1000
                  shutil.copyfile(frames[0],root/('Opening-API'+str(api)+'-'+view+'.png'))
          for api in (31,35):
              folder=Path('opening-evidence')/('shared-android-installed-'+str(api)+'-'+os.environ['SOURCE']+'-'+os.environ['GITHUB_RUN_ID'])
              for name in ('android-notes-main','android-notes-create-menu','android-notes-opened','android-notes-overflow','android-native-pdf-external-viewer','android-native-pdf-library','android-native-pdf-no-viewer','android-native-pdf-after-force-stop'):
                  frames=list(folder.rglob(name+'.png'))
                  assert len(frames)==1 and frames[0].stat().st_size>1000
                  shutil.copyfile(frames[0],root/(name+'-API'+str(api)+'.png'))
              logs=list(folder.rglob('pdf-*.log'))
              assert len(logs)==5 and all('OK (1 test)' in p.read_text() for p in logs)
          shutil.copyfile('docs/integration/LIBRARY_RELEASE_1_4_0.md',root/'TEST-REPORT.md')
          with (root/'TEST-REPORT.md').open('a') as report:
              report.write('\n## Actual publication gates\n\nSource: '+os.environ['SOURCE']+'\n\nCanonical Ubuntu/Windows: PASS — https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['CANONICAL_RUN']+'\n\nBuild/JVM and installed API31/API35: PASS — https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n\nThe attached APK is the same binary exercised on both installed emulators. Physical M11, actual vendor viewers, phone reboot and production signing remain unverified/unavailable.\n')
          signature=(root/'SIGNATURE.txt').read_text()
          certificate=re.search(r'certificate SHA-256 digest: ([0-9a-f]{64})',signature).group(1)
          previous_certificate='4d79d8fffce282212d84494353d496e594286d8a954b6e913057c7988b43fad8'
          record={'signing_certificate_sha256':certificate,'update_in_place_from_1_2_1':certificate==previous_certificate,'production_signing':'unavailable', 'source_sha' :os.environ['SOURCE'],'tree_sha':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'version_name':'1.4.0-unified-debug','version_code':19,'size_bytes':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'minimum_android':'7.0 (API24)',
            'abis':['armeabi-v7a','arm64-v8a','x86_64'],'signing':'debug; compare SIGNATURE.txt before updating an earlier installation',
            'verification_run':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'opening_image_sha256':opening_sha,'opening':'static original artwork; FIT_CENTER on black','emulator_profile':'pixel_2','software_navigation':True,'installed_emulator_apis':[31,35],'physical_phone':'not verified','private_original_fixtures':'not certified'}
          (root/'BUILD.json').write_text(json.dumps(record,indent=2)+'\n')
          Path('release-notes.md').write_text('Unified ANVAYA 1.4.0 — installable debug prerelease\n\n'
            'Built from merged main '+os.environ['SOURCE']+'. Canonical Linux/Windows synthetic checks and installed API31/API35 emulator checks passed for this source. The attached APK is the same binary used by those emulator checks.\n\n'
            'Opening: the owner-supplied static blue-logo artwork is preserved byte for byte, centred on black without cropping or animation. Opening-API31-launch.png and Opening-API35-launch.png show the first app-controlled frame rendered on the installed emulators; portrait/landscape assets also verify letterboxing.\n\n'
            'Includes the compact dark Notes card library, grid/list layouts, creation menu, note overflow actions and read-only Focus Reading. PDF taps open original stored bytes in an Android document viewer; Open with offers the native chooser. Renames and exports retain the current filename. Library now groups originals by semester and subject, with local Tutor processing, Trash, templates and streamed backup v2. No OCR or cloud AI is bundled. See docs/integration/LIBRARY_RELEASE_1_4_0.md at the source commit.\n\n'
            'Runs its Python backend on the phone; no separate computer/server is required. Cloud AI and Python internet access are disabled. Obsidian is a Markdown ZIP snapshot, not live sync. Legacy PPT needs conversion to PPTX for indexing. Scanned PDFs need OCR that may be unavailable. Physical phone, specific external player apps and private academic-source certification remain unverified.\n\n'
            'Installation: first use Settings → Manage courses & backups → Export private backup in your existing app. Keep that ZIP and independent copies of originals; older installed versions may have a 100 MiB backup limit. New v2 backups support up to 4 GiB expanded, with 512 MiB per file. Download ANVAYA-Unified-Latest.apk, allow installation from your browser when Android asks, and attempt an update. If Android reports a signature conflict, stop; keep the existing installation and data until the backup has been verified and all attachments/originals have independent copies. Production signing is unavailable. This debug prerelease cannot promise update compatibility with earlier runner-generated debug keys.\n\n'
            'Version 1.4.0-unified-debug / code 19; Android 7.0+; ARM32, ARM64, x86_64. BUILD.json records checksum, exact byte size and source provenance.\n')
          PY
      - name: Publish a versioned GitHub prerelease without overwriting existing releases
        run: |
          tag="anvaya-unified-v1.4.0-debug-${SOURCE:0:12}"
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --prerelease --title "ANVAYA Unified 1.4.0 — Debug" --notes-file release-notes.md
          mkdir downloaded-release
          curl --fail --location --retry 3 --output downloaded-release/ANVAYA-Unified-Latest.apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ANVAYA-Unified-Latest.apk"
          cmp release-assets/ANVAYA-Unified-Latest.apk downloaded-release/ANVAYA-Unified-Latest.apk
          printf '%s\n' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ANVAYA-Unified-Latest.apk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-release-provenance-${{ needs.source.outputs.sha }}
          path: release-assets/*
