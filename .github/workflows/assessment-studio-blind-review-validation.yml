name: Assessment Studio blind review validation

on:
  push:
    branches:
      - "phase7.5.assessment-studio-ux/blind-review-validation"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Blind review focused tests
        run: python -m pytest -q tests/test_assessment_studio_blind_review.py
      - name: Authoring UX tests
        run: python -m pytest -q tests/test_assessment_studio_authoring_ux.py
      - name: Assessment Studio Phase B regressions
        run: python -m pytest -q tests/test_assessment_studio_phase_b.py
      - name: Assessment Studio A-F regressions
        run: python -m pytest -q tests/test_assessment_studio_phase_a.py tests/test_assessment_studio_phase_c.py tests/test_assessment_studio_phase_d.py tests/test_assessment_studio_phase_e.py tests/test_assessment_studio_phase_f.py tests/test_phase7_5_assessments.py
      - name: Compile and dependency check
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check
      - name: Clone-safe project regression suite
        run: |
          python -m pytest -q             --ignore=tests/test_phase7_5_academic_agent_web.py             --deselect "tests/test_phase2_closure_architecture.py::test_phase2_root_has_no_production_learning_assistant_database"             --deselect "tests/test_phase7_5_anvaya_shell.py::test_existing_phase75_get_routes_keep_working"
      - name: Migration integrity smoke test
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from personal_learning_assistant.repositories.sqlite.migration_runner import apply_migrations
          root = Path(tempfile.mkdtemp())
          path = root / "learning_assistant.db"
          assert apply_migrations(path) == tuple(range(1, 15))
          connection = sqlite3.connect(path)
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("PRAGMA foreign_key_check").fetchall() == []
          finally:
              connection.close()
          PY
      - name: Diff hygiene
        run: git diff --check 99e9b7c806388902f2329fa76d130171aa029dee..HEAD
