name: Canonical topic catalogues validation

on:
  push:
    branches:
      - "phase7.5.assessment-studio/canonical-topic-catalogues"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Canonical catalogue focused tests
        run: |
          python -m pytest -q tests/test_canonical_topic_catalogue_service.py
      - name: Assessment Studio semantic-review regressions
        run: |
          python -m pytest -q             tests/test_assessment_studio_blind_review.py             tests/test_assessment_studio_authoring_ux.py             tests/test_assessment_studio_simplified_authoring.py
      - name: Compile and dependencies
        run: |
          python -m compileall -q personal_learning_assistant tests
          python -m pip check
      - name: Clone-safe regression suite
        run: |
          python -m pytest -q             --ignore=tests/test_phase7_5_academic_agent_web.py             --deselect "tests/test_phase2_closure_architecture.py::test_phase2_root_has_no_production_learning_assistant_database"             --deselect "tests/test_phase7_5_anvaya_shell.py::test_existing_phase75_get_routes_keep_working"
      - name: Diff hygiene
        run: git diff --check 10c1ae4c66188aeb3cfda425c22cef7b12461c67..HEAD
