name: UI V2 cross-platform acceptance
on:
  pull_request:
    paths:
      - 'personal_learning_assistant/ui/web/**'
      - 'tests/*ui_v2*'
      - 'scripts/ui_v2_capture.py'
      - '.github/workflows/ui-v2.yml'
  push:
    branches: ['feature/anvaya-ui-v2-home-obsidian-workspaces']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: UI V2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ANVAYA_BROWSER_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-learning-studio.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-learning-studio.txt
      - name: Restore historical checkout EOL bytes
        run: python scripts/architecture_checkout_eol.py --repo .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Record exact source and external evidence directory
        shell: python
        run: |
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-v2'
          out.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('ANVAYA_UI_V2_OUTPUT=' + str(out) + '\n')
              stream.write('ANVAYA_UI_V2_ARTIFACTS=' + str(out / 'screenshots') + '\n')
          source = {'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'platform': os.name}
          (out / 'source.json').write_text(json.dumps(source, indent=2), encoding='utf-8')
      - name: Focused browser gate requires zero skips
        shell: python
        run: |
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          out = pathlib.Path(os.environ['ANVAYA_UI_V2_OUTPUT'])
          with (out / 'browser.log').open('w', encoding='utf-8') as stream:
              result = subprocess.call([sys.executable, '-m', 'pytest', '-q', 'tests/test_ui_v2_browser.py', 'tests/test_ui_v2_protected_browser.py', 'tests/test_architecture_live_browser.py::test_active_attempt_reopens_after_real_server_restart_with_authoritative_timer', '--junitxml=' + str(out / 'browser.xml')], stdout=stream, stderr=subprocess.STDOUT)
          print((out / 'browser.log').read_text(encoding='utf-8'))
          if result: sys.exit(result)
          cases = ET.parse(out / 'browser.xml').findall('.//testcase')
          assert cases and all(c.find('skipped') is None for c in cases), 'Browser gate must execute every test'
      - name: Full regression suite
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['ANVAYA_UI_V2_OUTPUT'])
          with (out / 'full.log').open('w', encoding='utf-8') as stream:
              result = subprocess.call([sys.executable, '-m', 'pytest', '-q', '--junitxml=' + str(out / 'full.xml')], stdout=stream, stderr=subprocess.STDOUT)
          print((out / 'full.log').read_text(encoding='utf-8'))
          sys.exit(result)
      - name: Workspace JavaScript and whitespace checks
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import pathlib, subprocess
          for path in pathlib.Path('personal_learning_assistant/ui/web/static/js').glob('workspace*.js'):
              subprocess.run(['node', '--check', str(path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-v2-${{ matrix.os }}-${{ github.sha }}
          path: ${{ env.ANVAYA_UI_V2_OUTPUT }}/**
