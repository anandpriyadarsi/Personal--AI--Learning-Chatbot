plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'in.anvaya.privateapp'
    compileSdk 35
    defaultConfig {
        applicationId 'in.anvaya.privateapp'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.1.4-notes-test'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    sourceSets {
        main {
            python {
                srcDir '../..'
                include '*.py', 'personal_learning_assistant/**'
                exclude '**/__pycache__/**', '**/*.pyc'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'Flask==3.1.2'
            install 'Werkzeug==3.1.3'
            install 'Jinja2==3.1.6'
            install 'MarkupSafe==3.0.2'
            install 'itsdangerous==2.2.0'
            install 'click==8.1.8'
            install 'blinker==1.9.0'
            install 'mistune==3.3.4'
            install 'PyYAML==6.0.2'
            install 'pypdf==6.18.0'
            install 'Pillow==11.0.0'
            install 'python-dotenv==1.2.3'
            install 'requests==2.31.0'
            install 'certifi==2026.10.19'
            install 'charset-normalizer==3.5.2'
            install 'idna==3.20'
            install 'urllib3==2.8.0'
            install 'tzdata==2026.2'
        }
        extractPackages '*'
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
